[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sewer-agent"
version = "0.1.0"
description = "Durable CCTV sewer inspection agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
  "pillow==11.3.0",
  "temporalio==1.32.0",
  "psycopg[binary]==3.3.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.6"]
# Verified against the existing trusted YOLO26 checkpoint with one real GPU image.
gpu = ["ultralytics==8.4.46"]
# Text tokenizer only; local YOLOE and MobileCLIP2 assets are provisioned separately.
open-scan = [
  "clip @ git+https://github.com/ultralytics/CLIP.git@a13192f8cb767260d7dfd98c843b0716593169e7",
  "ftfy==6.3.1",
  "regex==2026.9.3",
]
# Optional SDKs for reproducing the provider's published API examples.
qwen-sdk = ["openai==3.11.0", "dashscope==1.27.4"]
# Offline alternative-detector experiments; provision public safetensors separately.
open-scan-hf = ["transformers==4.57.6"]
# Local restoration architectures; use the existing GPU torch environment.
enhancement = ["einops==0.8.1"]
# Prompted masks / relative depth; official local safetensors are provisioned separately.
geometry = ["transformers==4.57.6"]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.package-data]
"pipe_inspector.vision._enhancement_vendor" = ["*.md", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src", "."]
asyncio_mode = "auto"
markers = ["integration: requires local services", "gpu: requires existing local checkpoint and GPU", "live_api: requires explicitly configured external API"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
