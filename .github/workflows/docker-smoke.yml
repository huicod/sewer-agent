name: Docker deployment smoke

on:
  workflow_dispatch:
  push:
    branches: [dev/agent-v1, deploy/docker-compose]
    paths:
      - .github/workflows/docker-smoke.yml
      - .dockerignore
      - .env.docker.example
      - Dockerfile
      - compose.yaml
      - pyproject.toml
      - deploy/**
      - scripts/**
      - backend/src/**
      - backend/tests/docker_smoke_fixture.py
      - frontend/**

permissions:
  contents: read

concurrency:
  group: docker-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      COMPOSE_PROJECT_NAME: sewer-ci-${{ github.run_id }}-${{ github.run_attempt }}
      SEWER_HTTP_PORT: '18881'
      DASHSCOPE_API_KEY: synthetic-ci-only
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Make room for the CUDA image on the disposable runner
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf -- /usr/local/lib/android /usr/local/.ghcup /usr/share/dotnet
          df -h /

      - name: Deploy from an empty model directory with one shared key
        run: |
          mkdir -p "$RUNNER_TEMP/sewer-smoke"
          python3 scripts/docker_setup.py up --services api cpu-worker
          cp .env.docker "$RUNNER_TEMP/sewer-smoke/first-deploy.env"
          docker compose --env-file .env.docker run --rm --no-deps --entrypoint temporal temporal-namespace operator namespace describe --namespace default >/dev/null

      - name: Check that an empty model mount blocks the container entrypoint
        run: |
          mkdir -p "$RUNNER_TEMP/sewer-smoke/empty-models"
          if SEWER_MODELS_DIR="$RUNNER_TEMP/sewer-smoke/empty-models" docker compose --env-file .env.docker run --rm --no-deps initialize >"$RUNNER_TEMP/sewer-smoke/preflight.log" 2>&1; then
            echo 'An empty model mount unexpectedly passed startup checks' >&2
            exit 1
          fi
          grep -Fq 'detector weights are missing or empty' "$RUNNER_TEMP/sewer-smoke/preflight.log"

      - name: Verify database roles and HTTP uploads
        run: |
          docker compose --env-file .env.docker exec -T postgres psql -X --set=ON_ERROR_STOP=1 -U postgres -d postgres <<'SQL'
          DO $$ BEGIN
            IF has_database_privilege('sewer_agent', 'temporal', 'CONNECT')
               OR has_database_privilege('sewer_agent', 'temporal_visibility', 'CONNECT')
               OR has_database_privilege('sewer_temporal', 'sewer_agent', 'CONNECT')
               OR EXISTS (SELECT FROM pg_roles WHERE rolname IN ('sewer_agent','sewer_temporal')
                          AND (rolsuper OR rolcreaterole OR rolcreatedb)) THEN
              RAISE EXCEPTION 'unexpected cross-database or privileged access';
            END IF;
          END $$;
          SQL
          python3 backend/tests/docker_smoke_fixture.py seed
          python3 backend/tests/docker_smoke_fixture.py verify

      - name: Recreate containers and verify the retained records and bytes
        run: |
          docker compose --env-file .env.docker down
          env -u DASHSCOPE_API_KEY python3 scripts/docker_setup.py up --services api cpu-worker
          cmp -s .env.docker "$RUNNER_TEMP/sewer-smoke/first-deploy.env"
          python3 backend/tests/docker_smoke_fixture.py verify
          echo 'Public model download, one-key startup, web and CPU services, database initialization and persistent upload passed. GPU inference is a separate acceptance check.' >> "$GITHUB_STEP_SUMMARY"

      - name: Dispose of this CI project
        if: always() && hashFiles('.env.docker') != ''
        run: |
          docker compose --env-file .env.docker ps --all
          docker compose --env-file .env.docker down --volumes --remove-orphans
